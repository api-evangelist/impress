aid: impress
name: Impress
description: 'Impress (legal entity Smile2Impress SL) is a Barcelona-founded chain of
  clear-aligner orthodontic clinics, launched in 2019 by Vladimir Lupenko, Diliara Lupenko
  and Dr. Khaled Kasem, and today Europe''s largest invisible-orthodontics clinic network.
  It runs 110+ doctor-led clinics across ten countries — Spain, Italy, Portugal, France,
  the United Kingdom, Germany, the Netherlands, Sweden, Ukraine and the United States —
  has treated more than 500,000 patients, and pairs in-clinic 3D intraoral scanning and
  patented diagnostics with AI-assisted treatment planning and remote monitoring through
  its patient mobile app. Impress publishes no developer portal, API reference, SDK, CLI,
  status page, changelog or machine-readable specification of any kind: contract discovery
  found no OpenAPI, Swagger, GraphQL SDL, AsyncAPI, MCP server, A2A agent card or
  .well-known document on any host it operates. Its one API host, api.smile2impress.com,
  is the private backend for the Impress patient app and the Impress Clinics practitioner
  app; it resolves and is live but answers HTTP 403 to every anonymous request, including
  every spec and .well-known path probed. Its GitHub organization, github.com/smile2impress,
  is real but carries only internal engineering tooling — five forks of Node.js/TypeScript
  infrastructure libraries and one first-party static-analysis tool, fe-explorer — and no
  client library for any Impress service. Products sold are orthodontic treatment,
  retainers and teeth whitening, priced and booked through the consumer site.'
